{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Omawhiyte & Sons Admin{% endblock %}

{% block extrastyle %}
  {{ block.super }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'admin_theme/oma_admin.css' %}">
  <link rel="icon" type="image/png" href="{% static 'admin_theme/img/logo.png' %}">
{% endblock %}

{% block branding %}
  <div id="site-name">
    <a href="{% url 'admin:index' %}">
      <img src="{% static 'admin_theme/img/logo.png' %}" alt="Omawhiyte & Sons" class="oma-admin-logo">
      <span>Omawhiyte &amp; Sons <em>Admin</em></span>
    </a>
  </div>
{% endblock %}

{% block nav-global %}{% endblock %}
